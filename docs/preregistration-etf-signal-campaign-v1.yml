  approved_package_validator_sha256: "a93b6e7e6a5c2a60c583d4725e76e2d2259467968b4b369a8947ce5b309d34aa"
  calendar_snapshot_start: "2024-01-01"
  calendar_snapshot_end: "2028-12-31"
  generated_at: "PENDING_SOURCE_ATTESTATION"
