  source_csv_sha256: "PENDING"
  source_attestation_sha256: "PENDING"
  approved_dataset_sha256: "PENDING"
  approved_manifest_sha256: "PENDING"
  approved_catalog_sha256: "PENDING"
  yahoo_use:
    allowed_for_diagnostics: true
